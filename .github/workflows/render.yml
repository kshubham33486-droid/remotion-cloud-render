name: Render Remotion Video
on:
  workflow_dispatch:
    inputs:
      scene:
        description: 'Which scene to render? (Studio3D or Main)'
        required: true
        default: 'Studio3D'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx remotion render src/index.ts ${{ github.event.inputs.scene }} out/video.mp4 --gl=angle
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
          
